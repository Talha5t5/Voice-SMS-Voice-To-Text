# Conservative memory settings for stability
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.configureondemand=true

# JVM heap and metaspace caps - increased for React Native builds
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Kotlin daemon heap cap
kotlin.daemon.jvm.options=-Xmx512m

# NDK version
android.ndkVersion=26.1.10909125

# Signing config (your keystore)
MYAPP_RELEASE_STORE_FILE=wa.jks
MYAPP_RELEASE_STORE_PASSWORD=mnsuet.
MYAPP_RELEASE_KEY_ALIAS=wa
MYAPP_RELEASE_KEY_PASSWORD=mnsuet..

# Android build optimizations
android.enableR8.fullMode=false
android.useFullClasspathForDexingTransform=true
android.useAndroidX=true
android.enableJetifier=true

# RN architectures
reactNativeArchitectures=arm64-v8a,arm64-v8a,x86,x86_64

# New architecture toggle (Fabric / TurboModules)
newArchEnabled=false

# Hermes JS engine
hermesEnabled=true
